# Subject tags of the website bibliography (bibliography.html), replacing the automatic Zotero tags.
# Each tag has an id, an English and a German label and a facet. Persons and regions are tagged only when a work
# is about them, not when it merely mentions them.
facets:
  genre: {en: 'Genre and practice', de: 'Gattung und Praxis'}
  sources: {en: 'Sources and transmission', de: 'Quellen und Überlieferung'}
  law: {en: 'Fields of law', de: 'Rechtsgebiete'}
  themes: {en: 'Themes', de: 'Themen'}
  persons: {en: 'Jurists and physicians', de: 'Juristen und Ärzte'}
  regions: {en: 'Regions', de: 'Regionen'}
  period: {en: 'Period', de: 'Zeit'}
tags:
  - {id: legal-consilia, facet: genre, en: 'Legal consilia', de: 'Juristische Consilia'}
  - {id: medical-consilia, facet: genre, en: 'Medical consilia', de: 'Medizinische Consilia'}
