# Subject scheme for the consilia (Layer A: general keywords)
#
# Version 1.0, drafted 2026-09-23 by Claude Opus 5.5 on the editor's behalf
# (the editor delegated curation). Built top-down from the doctrinal structure
# of the ius commune and checked against the frequencies of the old
# machine vocabulary (keywords_final) so that every frequent real topic has a
# home. Used verbatim as the closed list for src/gpu/classify_units.py
# --task subjects and gpu/aggregate_subjects.py.
#
# Rules
# - Assign a concept only if the unit DISCUSSES it (a question, rule or argument
#   about it), not if a word merely occurs. Allegations alone do not count.
# - Prefer the most specific concept. Do not also assign its facet.
# - Genre descriptors are not concepts (legal opinion, jurisprudence, legal
#   interpretation in general, validity in general, civil/Roman/canon/medieval law,
#   evidence in general). "canon law" is expressed through the ECCL concepts.
# - The BODY facet is filled automatically from verified Layer B annotations
#   (roles topic/argument); the LLM does not assign BODY concepts in Layer A.
# - `old:` lists labels from the previous vocabulary that map here. It is used
#   only to bootstrap and compare, never shown to users.
#
# Each concept: id, en (preferred label), de (German label, display only), la (Latin label), scope (when to use),
# old (optional).

version: "1.0"

facets:
  - {id: SUCC, en: "Succession and last wills", de: "Erbrecht und letztwillige Verfügungen", la: "De successionibus et ultimis voluntatibus"}
  - {id: FAM,  en: "Marriage, dowry and family property", de: "Ehe, Mitgift und Familiengut", la: "De matrimonio, dote et bonis familiae"}
  - {id: PERS, en: "Persons, status and guardianship", de: "Personen, Status und Vormundschaft", la: "De personis, statu et tutela"}
  - {id: PROP, en: "Property, possession and real rights", de: "Eigentum, Besitz und dingliche Rechte", la: "De dominio, possessione et iuribus in re"}
  - {id: OBL,  en: "Contracts and obligations", de: "Verträge und Schuldverhältnisse", la: "De contractibus et obligationibus"}
  - {id: CRED, en: "Credit, security, usury and commerce", de: "Kredit, Sicherheiten, Wucher und Handel", la: "De credito, pignoribus, usuris et mercatura"}
  - {id: FEUD, en: "Feudal law", de: "Lehnrecht", la: "De feudis"}
  - {id: ECCL, en: "Church, benefices and ecclesiastical law", de: "Kirche, Pfründen und Kirchenrecht", la: "De rebus et personis ecclesiasticis"}
  - {id: PROC, en: "Procedure, proof and judgment", de: "Verfahren, Beweis und Urteil", la: "De iudiciis et probationibus"}
  - {id: CRIM, en: "Crimes and punishment", de: "Delikte und Strafen", la: "De delictis et poenis"}
  - {id: PUBL, en: "Statutes, jurisdiction and public authority", de: "Statuten, Gerichtsbarkeit und öffentliche Gewalt", la: "De statutis, iurisdictione et potestate publica"}
  - {id: METH, en: "General doctrines of law", de: "Allgemeine Rechtslehren", la: "De regulis iuris generalibus"}
  - {id: BODY, en: "The intimate body (from Layer B)", de: "Der intime Körper (aus Schicht B)", la: "De corpore"}

concepts:
  # ============================================================== SUCC
  - {id: succ_testament_form, facet: SUCC, en: "Form and solemnities of testaments", de: "Form und Förmlichkeiten des Testaments", la: "solemnitates testamenti", scope: "Validity of a will as to form: witnesses, notary, nuncupative/written will, testamentum inter liberos, statutory form.", old: [testament, will, solemnity, legal formalities, formal requirements, nuncupative will]}
  - {id: succ_testamentary_capacity, facet: SUCC, en: "Testamentary capacity", de: "Testierfähigkeit", la: "testamenti factio", scope: "Who can make a will or take under it (filiusfamilias, condemned, religious, insane, women under statute).", old: [legal capacity, testamentary capacity]}
  - {id: succ_heir_institution, facet: SUCC, en: "Institution of heirs", de: "Erbeinsetzung", la: "heredis institutio", scope: "Validity, meaning and effect of naming heirs; universal succession under a will.", old: [heir, universal succession, institution]}
  - {id: succ_interpretation_will, facet: SUCC, en: "Interpretation of last wills", de: "Auslegung letztwilliger Verfügungen", la: "interpretatio voluntatis testatoris", scope: "Construing the testator's words and presumed intention (who is meant by 'filii', 'descendentes', 'familia' etc.).", old: [intent, presumed will, ambiguity]}
  - {id: succ_codicil, facet: SUCC, en: "Codicils and the codicillary clause", de: "Kodizill und Kodizillarklausel", la: "codicilli; clausula codicillaris", scope: "Codicils, conversion of a failed testament via the codicillary clause.", old: [codicil]}
  - {id: succ_revocation, facet: SUCC, en: "Revocation and change of wills", de: "Widerruf und Änderung von Testamenten", la: "revocatio testamenti", scope: "Later wills, express or tacit revocation, ademption of legacies.", old: [revocation]}
  - {id: succ_conditions, facet: SUCC, en: "Conditions and modus in last wills", de: "Bedingungen und Auflagen in letztwilligen Verfügungen", la: "condiciones et modus", scope: "Conditions attached to institutions, legacies or fideicommissa, their fulfilment and validity (incl. 'si sine liberis decesserit').", old: [condition, conditional disposition]}
  - {id: succ_disinheritance, facet: SUCC, en: "Disinheritance and preterition", de: "Enterbung und Übergehung", la: "exheredatio; praeteritio", scope: "Omission or disinheritance of children/parents, just causes of disinheritance, rupture of a testament.", old: [disinheritance, preterition, omission]}
  - {id: succ_legitima, facet: SUCC, en: "Forced share and querela inofficiosi testamenti", de: "Pflichtteil und querela inofficiosi testamenti", la: "legitima; querela inofficiosi", scope: "The children's/parents' legitimate portion and remedies against an inofficious will.", old: [legitimate portion, forced share]}
  - {id: succ_falcidia, facet: SUCC, en: "Falcidian quarter", de: "Falzidische Quart", la: "quarta Falcidia", scope: "Heir's right to retain a quarter against legacies.", old: [Falcidian portion]}
  - {id: succ_trebellian, facet: SUCC, en: "Trebellian quarter", de: "Trebellianische Quart", la: "quarta Trebellianica", scope: "Fiduciary heir's quarter against universal fideicommissa.", old: [Trebellian portion]}
  - {id: succ_vulgar_substitution, facet: SUCC, en: "Vulgar substitution", de: "Gemeine Substitution (substitutio vulgaris)", la: "substitutio vulgaris", scope: "Substitute heir if the first does not become heir.", old: [vulgar substitution, substitution, testamentary substitution]}
  - {id: succ_pupillary_substitution, facet: SUCC, en: "Pupillary and exemplary substitution", de: "Pupillar- und Exemplarsubstitution", la: "substitutio pupillaris; exemplaris", scope: "Substitution for a child dying before puberty, or for an insane descendant.", old: [pupillary substitution, pupillarity, pupillary age]}
  - {id: succ_fideicommissum, facet: SUCC, en: "Fideicommissa and fideicommissary substitution", de: "Fideikommiss und fideikommissarische Substitution", la: "fideicommissum", scope: "Trusts in wills: universal or singular fideicommissa, restitution by the fiduciary, fideicommissary substitution, tacit fideicommissa.", old: [fideicommissum, fideicommissary substitution, fiduciary, burdened inheritance]}
  - {id: succ_family_fideicommissum, facet: SUCC, en: "Family fideicommissum and prohibition to alienate outside the family", de: "Familienfideikommiss und Veräußerungsverbot außerhalb der Familie", la: "fideicommissum familiae; prohibitio alienandi extra familiam", scope: "Keeping property in the lineage: successive calls of agnates, prohibition of alienation extra familiam, primogeniture-like arrangements.", old: [male succession, agnatic succession, perpetuity, male preference]}
  - {id: succ_legacy, facet: SUCC, en: "Legacies", de: "Vermächtnisse", la: "legata", scope: "Validity, object, extent, delivery and lapse of legacies; legatees' rights.", old: [legacy, bequest, legatee]}
  - {id: succ_pious_legacy, facet: SUCC, en: "Legacies and dispositions for pious causes", de: "Vermächtnisse und Verfügungen zu frommen Zwecken", la: "relicta ad pias causas", scope: "Dispositions for the soul, churches, hospitals, the poor; privileges of pious causes (formal leniency, Falcidia).", old: [pious causes, charity, pious foundation]}
  - {id: succ_donatio_mortis_causa, facet: SUCC, en: "Gifts in contemplation of death", de: "Schenkung auf den Todesfall", la: "donatio causa mortis", scope: "Donations mortis causa and their treatment like legacies.", old: [donation causa mortis]}
  - {id: succ_executor, facet: SUCC, en: "Testamentary executors", de: "Testamentsvollstrecker", la: "executores testamenti; fideicommissarii", scope: "Powers, duties and accountability of executors of wills.", old: [executor]}
  - {id: succ_intestate, facet: SUCC, en: "Intestate succession", de: "Gesetzliche Erbfolge", la: "successio ab intestato", scope: "Order of heirs without a will under ius commune (Nov. 118) or statute; degrees and classes.", old: [intestate succession, intestacy, nearest relatives, degree of kinship]}
  - {id: succ_agnatic_exclusion, facet: SUCC, en: "Statutory exclusion of women and cognates", de: "Statutarischer Ausschluss von Frauen und Kognaten", la: "exclusio feminarum propter masculos", scope: "Statutes preferring males/agnates, exclusion of dowered daughters and their descendants, 'favor agnationis'.", old: [female exclusion, exclusion, female inheritance, daughters, agnate, agnation, male preference]}
  - {id: succ_mother_succession, facet: SUCC, en: "Succession of and to mothers", de: "Erbfolge von und nach Müttern", la: "successio matris; SC Tertullianum et Orphitianum", scope: "Mother's rights in her children's inheritance and vice versa; uterine siblings.", old: [mother, maternal rights, maternal kin, uterine sibling, maternal line]}
  - {id: succ_representation, facet: SUCC, en: "Representation and per stirpes / per capita division", de: "Eintrittsrecht und Teilung nach Stämmen oder Köpfen", la: "ius repraesentationis; successio in stirpes vel in capita", scope: "Grandchildren/nephews taking a predeceased parent's place; how shares are counted.", old: [representation, per stirpes, per capita, grandson, grandparent]}
  - {id: succ_accretion, facet: SUCC, en: "Accrual among heirs and legatees", de: "Anwachsung unter Erben und Vermächtnisnehmern", la: "ius accrescendi", scope: "What happens to a failed share among co-heirs/co-legatees.", old: [accretion, right of accrual, coheir]}
  - {id: succ_acceptance, facet: SUCC, en: "Acceptance, repudiation and transmission of inheritance", de: "Antritt, Ausschlagung und Transmission der Erbschaft", la: "aditio, repudiatio et transmissio hereditatis", scope: "Entering upon or refusing an inheritance; transmission of the right to accept; abstention.", old: [acceptance, repudiation of inheritance, transmission, devolution]}
  - {id: succ_inventory, facet: SUCC, en: "Benefit of inventory and heirs' liability for debts", de: "Inventarwohltat und Haftung der Erben für Schulden", la: "beneficium inventarii", scope: "Limiting the heir's liability; separation of estates; heirs' liability for the deceased's debts.", old: [benefit of inventory]}
  - {id: succ_collation, facet: SUCC, en: "Collation", de: "Ausgleichung (Kollation)", la: "collatio bonorum et dotis", scope: "Bringing prior gifts/dowries into the account among descendants.", old: [collation]}
  - {id: succ_partition, facet: SUCC, en: "Partition of estates", de: "Erbteilung", la: "divisio hereditatis; actio familiae erciscundae", scope: "Dividing an inheritance among co-heirs, and validity of partitions.", old: [partition, division of property, division, undivided property]}
  - {id: succ_postumi, facet: SUCC, en: "Posthumous children in succession", de: "Nachgeborene in der Erbfolge", la: "postumi", scope: "Institution, disinheritance or preterition of postumi; rupture of a will by a later-born child (legal-technical side; the bodily side is Layer B).", old: [posthumous child, posthumous]}
  - {id: succ_survivorship, facet: SUCC, en: "Survivorship and order of death", de: "Überleben und Reihenfolge des Todes", la: "commorientes; praesumptio superstitis", scope: "Who died first; predecease; presumptions about survival.", old: [survivorship, predecease, survivor]}
  - {id: succ_reversion, facet: SUCC, en: "Reversion of property to donors or their line", de: "Rückfall von Gütern an Schenker oder ihre Linie", la: "reversio; ius revertendi", scope: "Return of dowries, gifts or fiefs to the giver or his family on a condition or death.", old: [reversion]}
  - {id: succ_caducity, facet: SUCC, en: "Lapse and vacant inheritance", de: "Verfall und erbenlose Erbschaft", la: "caducum; bona vacantia", scope: "Lapsed dispositions; inheritance without heirs; fisc's claim.", old: [caducity, vacancy]}

  # ============================================================== FAM
  - {id: fam_marriage_validity, facet: FAM, en: "Formation and validity of marriage", de: "Eheschließung und Gültigkeit der Ehe", la: "matrimonium contrahendum; validitas matrimonii", scope: "Consent, words of present tense, publicity, clandestine marriage, proof of marriage. (Bodily aspects -> Layer B.)", old: [marriage, consent, clandestine marriage]}
  - {id: fam_betrothal, facet: FAM, en: "Betrothal", de: "Verlöbnis", la: "sponsalia", scope: "Engagement, its breach and penalties, arrhae sponsaliciae.", old: [betrothal]}
  - {id: fam_impediments, facet: FAM, en: "Impediments to marriage and dispensation", de: "Ehehindernisse und Dispens", la: "impedimenta matrimonii", scope: "Consanguinity, affinity, spiritual kinship, vows as impediments; papal dispensation.", old: [impediment, consanguinity, affinity, dispensation]}
