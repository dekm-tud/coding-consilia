  - {id: fam_dotal_renunciation, facet: FAM, en: "Renunciation by dowered daughters", de: "Verzicht ausgestatteter Töchter", la: "renuntiatio filiae dotatae", scope: "Daughters' renunciation of paternal inheritance in exchange for dowry, often sworn; its validity.", old: [renunciation, waiver, oath]}
  - {id: fam_marital_gifts, facet: FAM, en: "Marital gifts and donatio propter nuptias", de: "Ehegeschenke und donatio propter nuptias", la: "donatio propter nuptias; donatio inter virum et uxorem", scope: "Counter-dowry, gifts between spouses and their invalidity.", old: [marital gifts, marriage settlement]}
  - {id: fam_paraphernalia, facet: FAM, en: "Paraphernal and extradotal goods", de: "Paraphernal- und außerdotales Gut", la: "bona paraphernalia", scope: "Wife's property outside the dowry; husband's administration.", old: [paraphernal property, paraphernalia]}
  - {id: fam_second_marriage, facet: FAM, en: "Second marriages and their penalties", de: "Zweite Ehe und ihre Nachteile", la: "secundae nuptiae; lex hac edictali", scope: "Penalties and restrictions on remarrying spouses, especially toward children of the first marriage (property side).", old: [second marriage, remarriage, first marriage, step-relatives]}
  - {id: fam_widow_rights, facet: FAM, en: "Widows' rights and maintenance", de: "Rechte und Unterhalt der Witwe", la: "iura viduae; alimenta viduae", scope: "Widow's maintenance, residence, usufruct, tutela of children.", old: [widow]}
  - {id: fam_maintenance, facet: FAM, en: "Maintenance obligations among relatives", de: "Unterhaltspflichten unter Verwandten", la: "alimenta", scope: "Duty to maintain children, parents, spouses, illegitimate children.", old: [alimony, maintenance, subsistence]}
  - {id: fam_kinship, facet: FAM, en: "Kinship: agnation, cognation, degrees", de: "Verwandtschaft: Agnation, Kognation, Grade", la: "agnatio, cognatio, gradus", scope: "Computing degrees and defining relatives where this is the issue (statutes, fideicommissa).", old: [kinship, agnation, cognation, blood relatives, collateral relatives, degree of kinship, siblings]}
  - {id: fam_brothers_community, facet: FAM, en: "Family and fraternal community of goods", de: "Familien- und Brüdergemeinschaft der Güter", la: "fraterna societas; communio bonorum inter fratres", scope: "Brothers or relatives living and trading together; presumptions about acquisitions.", old: [brotherhood, common property, undivided property]}

