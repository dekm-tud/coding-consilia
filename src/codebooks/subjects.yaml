  - {id: fam_dowry_restitution, facet: FAM, en: "Restitution and recovery of dowry", de: "Rückgabe und Rückforderung der Mitgift", la: "restitutio dotis; actio de dote", scope: "Return of dowry at the end of marriage; wife's priority and tacit hypothec; dowry insurance/security.", old: [restitution of dowry, dowry restitution]}
