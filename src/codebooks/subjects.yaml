  - {id: pers_religious_profession, facet: PERS, en: "Religious profession and its property effects", de: "Ordensprofess und ihre vermögensrechtlichen Folgen", la: "professio religiosa", scope: "Entry into religion and the professed person's capacity, inheritance and property.", old: [religious profession, monastic profession, nuns]}
  - {id: pers_absence, facet: PERS, en: "Absence and presumption of death", de: "Abwesenheit und Todesvermutung", la: "absentia", scope: "Absent persons, presumption of death, administration of their goods.", old: [absence]}
  - {id: pers_banishment_civil_death, facet: PERS, en: "Banishment, outlawry and civil death", de: "Verbannung, Acht und bürgerlicher Tod", la: "bannum; mors civilis", scope: "Legal effects of exile/outlawry and condemnation on property and capacity.", old: [outlawry, ban, civil death, flight]}
  - {id: pers_infamy, facet: PERS, en: "Infamy", de: "Infamie", la: "infamia", scope: "Infamia and its consequences on office, testimony, capacity.", old: [infamy, reputation]}
  - {id: pers_jews, facet: PERS, en: "Jews", de: "Juden", la: "Iudaei", scope: "Legal position of Jews (contracts, lending, testimony, conversion, inheritance).", old: [Jews]}
  - {id: pers_slaves, facet: PERS, en: "Slaves and servile status", de: "Sklaven und Unfreiheit", la: "servi; servitus personalis", scope: "Slaves and manumission (personal status, not praedial servitudes).", old: [slave, manumission, penal slavery]}

  # ============================================================== PROP
  - {id: prop_ownership, facet: PROP, en: "Ownership and its vindication", de: "Eigentum und Vindikation", la: "dominium; rei vindicatio", scope: "Title, transfer of ownership, vindication, direct vs useful dominion.", old: [ownership, property, dominion, dominium, rei vindicatio, direct dominion, useful dominion]}
