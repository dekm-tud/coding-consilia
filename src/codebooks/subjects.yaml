  - {id: prop_servitudes, facet: PROP, en: "Servitudes", de: "Dienstbarkeiten", la: "servitutes", scope: "Praedial and personal servitudes other than usufruct: ways, light, walls, drainage.", old: [servitude, wall]}
  - {id: prop_water, facet: PROP, en: "Water rights, rivers and mills", de: "Wasserrechte, Flüsse und Mühlen", la: "aquae; flumina; molendina", scope: "Use of rivers and channels, mills, alluvion, islands, flooding.", old: [water rights, mill, water management, sluice, flood]}
  - {id: prop_usufruct, facet: PROP, en: "Usufruct", de: "Nießbrauch", la: "ususfructus", scope: "Creation, extent and end of usufruct (incl. widow's usufruct).", old: [usufruct]}
  - {id: prop_emphyteusis, facet: PROP, en: "Emphyteusis and livelli", de: "Emphyteuse und Livell", la: "emphyteusis; libellus", scope: "Perpetual leases, canon, devolution for non-payment, alienation of the emphyteutic right.", old: [emphyteusis, investiture, census, consolidation, forfeiture]}
  - {id: prop_boundaries, facet: PROP, en: "Boundaries between lands", de: "Grundstücksgrenzen", la: "fines regundi", scope: "Boundary disputes and markers.", old: [boundary]}
